<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artryst Calendar</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="prototype-container">
        <!-- Splash Screen -->
        <div class="screen" id="splash-screen">
            <div class="content splash-content">
                <div class="logo-container">
                    <h1 class="gradient-text">Artryst</h1>
                </div>
                <div class="loading-indicator"></div>
                <button class="next-btn" data-next="auth-screen">Get Started</button>
            </div>
        </div>

        <!-- Auth Screen -->
        <div class="screen hidden" id="auth-screen">
            <div class="content">
                <div class="logo-container">
                    <h1 class="gradient-text">Welcome to Artryst</h1>
                </div>
                <div class="auth-form">
                    <div class="input-group">
                        <label>Phone Number</label>
                        <div class="phone-input">
                            <span class="prefix">+91</span>
                            <input type="tel" placeholder="Enter your phone number" class="input-field">
                        </div>
                    </div>
                    <button class="primary-btn next-btn" data-next="calendar-screen">Send OTP</button>
                    <div class="social-login">
                        <button class="social-btn google">
                            <img src="https://www.google.com/favicon.ico" alt="Google">
                            Continue with Google
                        </button>
                        <button class="social-btn instagram">
                            <img src="https://www.instagram.com/favicon.ico" alt="Instagram">
                            Continue with Instagram
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Calendar Screen -->
        <div class="screen hidden" id="calendar-screen">
            <div class="content">
                <div class="header">
                    <h2>Calendar</h2>
                    <button class="profile-btn">
                        <img src="https://via.placeholder.com/32" alt="Profile" class="profile-img">
                    </button>
                </div>
                <div class="month-navigator">
                    <button class="nav-btn prev">←</button>
                    <span class="current-month">December 2023</span>
                    <button class="nav-btn next">→</button>
                </div>
                <div class="calendar-grid">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
                <button class="floating-btn add-btn next-btn" data-next="add-event-screen">+</button>
            </div>
        </div>

        <!-- Add Event Screen -->
        <div class="screen hidden" id="add-event-screen">
            <div class="content">
                <div class="header">
                    <h2>Add New Show</h2>
                </div>
                <div class="event-form">
                    <div class="form-section">
                        <label class="required">Date</label>
                        <div class="date-picker">
                            <input type="date" class="input-field">
                        </div>
                    </div>
                    <div class="form-section">
                        <label class="required">Location</label>
                        <input type="text" placeholder="Enter venue name" class="input-field">
                    </div>
                    <div class="form-section">
                        <label>Show Name (Optional)</label>
                        <input type="text" placeholder="Give your show a name" class="input-field">
                    </div>
                    <button class="primary-btn next-btn" data-next="map-picker-screen">Choose Location</button>
                </div>
            </div>
        </div>

        <!-- Map Picker Screen -->
        <div class="screen hidden" id="map-picker-screen">
            <div class="content">
                <div class="header">
                    <h2>Choose Location</h2>
                </div>
                <div class="map-placeholder">
                    <p>Map View</p>
                </div>
                <button class="primary-btn next-btn" data-next="calendar-screen">Confirm Location</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
