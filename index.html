<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artryst Calendar Prototype</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="prototype-container">
        <!-- Splash Screen -->
        <div class="screen" id="splash-screen">
            <div class="content">
                <h1>Artryst Calendar</h1>
                <p>Your Creative Journey Starts Here</p>
                <button class="next-btn" data-next="auth-screen">Get Started</button>
            </div>
        </div>

        <!-- Auth Screen -->
        <div class="screen hidden" id="auth-screen">
            <div class="content">
                <h2>Welcome Back</h2>
                <div class="auth-form">
                    <input type="email" placeholder="Email" class="input-field">
                    <input type="password" placeholder="Password" class="input-field">
                    <button class="primary-btn next-btn" data-next="calendar-screen">Sign In</button>
                    <button class="secondary-btn">Create Account</button>
                </div>
            </div>
        </div>

        <!-- Calendar Screen -->
        <div class="screen hidden" id="calendar-screen">
            <div class="content">
                <div class="header">
                    <h2>Calendar</h2>
                    <button class="add-btn next-btn" data-next="add-event-screen">+ Add Event</button>
                </div>
                <div class="calendar-grid">
                    <!-- Calendar days will be generated by JavaScript -->
                </div>
            </div>
        </div>

        <!-- Add Event Screen -->
        <div class="screen hidden" id="add-event-screen">
            <div class="content">
                <h2>Add New Event</h2>
                <div class="event-form">
                    <input type="text" placeholder="Event Title" class="input-field">
                    <input type="datetime-local" class="input-field">
                    <textarea placeholder="Event Description" class="input-field"></textarea>
                    <button class="primary-btn next-btn" data-next="map-picker-screen">Choose Location</button>
                </div>
            </div>
        </div>

        <!-- Map Picker Screen -->
        <div class="screen hidden" id="map-picker-screen">
            <div class="content">
                <h2>Choose Location</h2>
                <div class="map-placeholder">
                    <p>Map View</p>
                </div>
                <button class="primary-btn next-btn" data-next="calendar-screen">Confirm Location</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
